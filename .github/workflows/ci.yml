name: CI

on:
  push:
    branches: ['**']

# A new push to the same branch makes the previous run pointless, so stop it
# rather than paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  PHP_EXTENSIONS: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, pdo, pdo_mysql, pdo_sqlite, tokenizer, xml, zip

jobs:
  tests:
    name: Style and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style
        run: ./vendor/bin/pint --test

      - name: Run tests
        run: php artisan test

  tests-mariadb:
    name: Tests against MariaDB
    runs-on: ubuntu-latest

    # SQLite is fast enough for the everyday run, but it does not behave like
    # the database this app actually uses: enum columns, SELECT ... FOR UPDATE
    # and the date functions all differ. The row locking that protects checkout
    # from overselling is a no-op under SQLite, so it is only really exercised
    # here.
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  docker:
    name: Docker image
    runs-on: ubuntu-latest

    # Builds the release artifact and proves it actually serves, which the PHP
    # jobs above cannot: they run the source tree directly and never exercise
    # the image, its extensions, its document root or its permissions.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate an application key
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Build and start the release stack
        # The CI overlay drops the bind mount, so this runs what the image
        # contains rather than the checked-out working tree.
        run: docker compose -f compose.yaml -f compose.ci.yaml up -d --build --wait

      - name: Migrate and seed
        run: docker compose -f compose.yaml -f compose.ci.yaml exec -T app php artisan migrate --seed --force

      - name: Smoke test
        run: |
          set -eu
          fail=0
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "http://localhost:8000$1")
            if [ "$code" != "$2" ]; then
              echo "::error::$1 returned $code, expected $2"
              fail=1
            else
              echo "ok   $1 -> $code"
            fi
          }
          check /up 200
          check / 200
          check /shop 200
          check /login 200
          check /become-a-supplier 200
          check /cart 200
          check /admin 302
          check /assets/css/style.css 200

          # APP_DEBUG is off in the release configuration, so an error page must
          # not carry a stack trace.
          if curl -s --max-time 15 http://localhost:8000/no-such-page | grep -qi 'stack trace'; then
            echo "::error::debug details are exposed on error pages"
            fail=1
          fi

          exit $fail

      - name: Container logs
        if: failure()
        run: docker compose -f compose.yaml -f compose.ci.yaml logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml -f compose.ci.yaml down -v
