; Settings the application relies on, applied on top of the base image defaults.

memory_limit = 256M
upload_max_filesize = 8M
post_max_size = 12M
max_execution_time = 60

date.timezone = Asia/Kolkata

; Errors go to the container log, never to the browser.
display_errors = Off
log_errors = On
error_log = /dev/stderr

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
