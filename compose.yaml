# Local development stack.
#
# The image is the same one CI builds and a deployment would run; the bind mount
# below is what makes it a development environment rather than a release. Remove
# the mount and you are running exactly what ships.

services:
  app:
    build:
      context: .
      target: app
      args:
        # Matches the worker to whoever owns the bind-mounted source, so the
        # container can write to storage. Override with APP_UID in .env if your
        # user id is not 1000.
        APP_UID: ${APP_UID:-1000}
    ports:
      - '8000:80'
    volumes:
      # Source is mounted so edits are live. The container therefore uses the
      # vendor directory from the host, not the one baked into the image.
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_URL: http://localhost:8000

      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: '3306'
      DB_DATABASE: mow_marketplace
      DB_USERNAME: mow_market
      DB_PASSWORD: secret

      # Mail is caught by Mailpit rather than sent anywhere.
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: '1025'
      MAIL_FROM_ADDRESS: noreply@mealsonwheels.local
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: mow_marketplace
      MARIADB_USER: mow_market
      MARIADB_PASSWORD: secret
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # The app waits on this, so it never starts against a database that is
      # listening but not yet ready to answer.
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '8025:8025'

volumes:
  db-data:
